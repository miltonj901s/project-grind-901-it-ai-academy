<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11152b"><meta name="description" content="Project Grind 901 IT and AI Business School and Interactive Gaming Lab"><link rel="manifest" href="manifest.json"><title>Project Grind 901 Academy</title>
<style>
:root{--bg:#0e1326;--panel:#19213b;--panel2:#222d4d;--ink:#f7f8ff;--muted:#b8c1dc;--accent:#aaaaff;--teal:#8ce6d4;--line:#35415f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;cursor:pointer}.app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:86px}.top{padding:22px 18px 18px;background:linear-gradient(135deg,#1b2342,#302c61);position:sticky;top:0;z-index:3}.brand{font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:800}.top h1{font-size:25px;margin:5px 0}.top p{margin:0;color:var(--muted);font-size:14px}.content{padding:18px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--teal);font-weight:700}.page-title{font-size:24px;margin:5px 0 8px}.intro{color:var(--muted);line-height:1.5;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile,.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.tile{min-height:135px;text-align:left;color:var(--ink);width:100%}.tile .emoji{font-size:27px}.tile strong{display:block;margin:9px 0 4px}.tile small,.muted{color:var(--muted);line-height:1.45}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.stat{background:var(--panel2);border-radius:13px;padding:14px}.stat b{display:block;font-size:23px}.item{border-radius:12px;margin:9px 0}.item b{display:block;margin-bottom:5px}.pill{display:inline-block;background:#34365f;color:#dadaff;padding:4px 9px;border-radius:99px;font-size:11px;margin-top:8px}.notice{font-size:12px;color:#f4dca0;background:#40351e;padding:11px;border-radius:10px;margin-top:14px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#121a30;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:4}.bottom button{background:none;border:0;color:var(--muted);font-size:11px;di </style></head><body><div class="app"><header class="top"><div class="brand">PROJECT GRIND 901</div><h1>Academy Learning Center</h1><p>Learn. Build. Innovate. Compete.</p><p style="margin-top:12px"><a href="./portal.html" style="display:inline-block;background:#aaaaff;color:#17172d;text-decoration:none;font-weight:700;padding:10px 14px;border-radius:10px">Student / Staff Sign In →</a></p></header><main id="view" class="content" aria-live="polite"></main><nav class="bottom" id="nav" aria-label="Main navigation"></nav></div>
<script>
const pages=[["home","🏠","Home"],["schools","🎓","Schools"],["courses","📚","Courses"],["attendance","🗓️","Attendance"],["work","📝","Coursework"],["projects","🧩","Projects"],["exams","📋","Exams"],["bootcamps","🚀","Boot Camps"],["admin","⚙️","Admin"]];
const courses=[["IT Foundations","IT & AI Business School","Technology basics, computer systems and digital skills."],["AI Fundamentals","IT & AI Business School","AI concepts, responsible use and practical tools."],["AI Tools & Automation","IT & AI Business School","Workflows, productivity and automation."],["Cybersecurity Foundations","IT & AI Business School","Security awareness, risks and safe practices."],["Programming Foundations","IT & AI Business School","Problem-solving skills with code."],["Web & App Development","IT & AI Business School","Responsive digital experiences."],["Game Development Foundations","Interactive Gaming Lab","Game mechanics, design and development."],["AI Game Design","Interactive Gaming Lab","AI-assisted game experience prototypes."],["2D/3D Game Design","Interactive Gaming Lab","Assets, scenes, animation and level design."]];
let current="home";function go(id){current=id;render()}function card(t,d,tag=""){return '<div class="item"><b>'+t+'</b><div class="muted">'+d+'</div>'+(tag?'<span class="pill">'+tag+'</span>':'')+'</div>'}
function render(){const v=document.getElementById("view");let h="";
if(current==="home")h='<div class="eyebrow">Student and instructor platform</div><h2 class="page-title">Welcome to Project Grind 901</h2><p class="intro">A connected learning environment for information technology, artificial intelligence, business and interactive game development.</p><div class="stats"><div class="stat"><b>2</b><span class="muted">Learning divisions</span></div><div class="stat"><b>'+courses.length+'</b><span class="muted">Sample courses</span></div><div class="stat"><b>9</b><span class="muted">Learning modules</span></div><div class="stat"><b>901</b><span class="muted">Memphis roots</span></div></div><div class="grid"><button class="tile" onclick="go(\'schools\')"><span class="emoji">🎓</span><strong>Explore Schools</strong><small>Business School and Gaming Lab</small></button><button class="tile" onclick="go(\'courses\')"><span class="emoji">📚</span><strong>Course Catalog</strong><small>Browse learning pathways</small></button><button class="tile" onclick="go(\'work\')"><span class="emoji">📝</span><strong>Coursework</strong><small>Lessons and assignments</small></button><button class="tile" onclick="go(\'bootcamps\')"><span class="emoji">🚀</span><strong>Boot Camps</strong><small>Intensive skill programs</small></button></div><div class="notice">Prototype only: no real student accounts, attendance, submissions, grades or instructor permissions are connected yet. Do not enter real student information.</div>';
if(current==="schools")h='<div class="eyebrow">Our learning divisions</div><h2 class="page-title">Choose your school</h2><p class="intro">Two divisions share one future-focused academy.</p><div class="grid"><button class="tile" onclick="go(\'courses\')"><span class="emoji">🤖</span><strong>IT & AI Business School</strong><small>IT, AI, cybersecurity, business technology, entrepreneurship and project management.</small></button><button class="tile" onclick="go(\'courses\')"><span class="emoji">🎮</span><strong>Interactive Gaming Lab</strong><small>Game design, programming, AI game development, testing and publishing.</small></button></div>';
if(current==="courses")h='<div class="eyebrow">Learning catalog</div><h2 class="page-title">Courses</h2><p class="intro">Proposed introductory course catalog. Enrollment and lesson delivery will be added later.</p>'+courses.map(c=>card(c[0],c[2],c[1])).join("");
if(current==="attendance")h='<div class="eyebrow">Student services</div><h2 class="page-title">Attendance</h2><p class="intro">Future attendance area for class check-ins, instructor verification, absence notes and summaries.</p>'+card("Class check-in","Students check in to scheduled sessions after authentication.","Planned")+card("Attendance history","View verified present, absent and excused records.","Planned")+card("Instructor register","Authorized instructors record and review attendance.","Planned");
if(current==="work")h='<div class="eyebrow">Learning activities</div><h2 class="page-title">Coursework & Homework</h2><p class="intro">Future workspace for lessons, assignment instructions, due dates, file submissions and feedback.</p>'+card("Weekly lessons","Lesson materials and learning resources.","Planned")+card("Homework assignments","Instructions, due dates and submission status.","Planned")+card("My submissions","Upload work and receive instructor feedback.","Planned");
if(current==="projects")h='<div class="eyebrow">Hands-on learning</div><h2 class="page-title">Projects</h2><p class="intro">Build a portfolio through individual and team-based practical work.</p>'+card("Project briefs","Objectives, requirements, milestones and rubrics.","Planned")+card("Team workspace","Collaborate and track responsibilities.","Planned")+card("Portfolio","Showcase completed projects and skills.","Planned");
if(current==="exams")h='<div class="eyebrow">Assessment center</div><h2 class="page-title">Exams & Quizzes</h2><p class="intro">Future assessment area with controlled access, scoring and instructor review.</p>'+card("Practice quizzes","Knowledge checks and learning feedback.","Planned")+card("Course examinations","Scheduled assessments with attempt controls.","Planned")+card("Grades & feedback","Scores, rubrics and instructor comments.","Planned");
if(current==="bootcamps")h='<div class="eyebrow">Accelerated learning</div><h2 class="page-title">Boot Camps</h2><p class="intro">Short, structured programs focused on practical skills and portfolio outcomes.</p>'+["AI Developer Boot Camp","Coding Boot Camp","Game Developer Boot Camp","IT Support Boot Camp","Cybersecurity Foundations Boot Camp","AI Business Startup Boot Camp"].map(x=>card(x,"Program overview, schedule, enrollment and completion tracking.","Proposed program")).join("");
if(current==="admin")h='<div class="eyebrow">Staff workspace</div><h2 class="page-title">Administration</h2><p class="intro">Planned management tools for authorized administrators and instructors.</p>'+["Student records and enrollment","Instructor and staff accounts","Course and lesson publishing","Attendance management","Assignments and grading","Exams and reporting","Boot camp scheduling","Certificates and completion"].map(x=>card(x,"Role-restricted management module.","Planned")).join("");
v.innerHTML=h;document.getElementById("nav").innerHTML=pages.slice(0,5).map(p=>'<button class="'+(current===p[0]?'active':'')+'" onclick="go(\''+p[0]+'\')"><span>'+p[1]+'</span>'+p[2]+'</button>').join("")}render();
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
